services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: abhedyax-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - SIMULATION_MODE=${SIMULATION_MODE:-true}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-abhedyax}:${POSTGRES_PASSWORD:-abhedyax_secret}@postgres:5432/${POSTGRES_DB:-abhedyax_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./services:/workspace/services
      - ./packages:/workspace/packages
      - ./configs:/workspace/configs
      - ./storage:/workspace/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - abhedyax-net

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: abhedyax-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_SIMULATION_MODE=${NEXT_PUBLIC_SIMULATION_MODE:-true}
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./packages:/workspace/packages
      - /workspace/apps/web/node_modules
    depends_on:
      - api
    networks:
      - abhedyax-net

  postgres:
    image: postgres:16-alpine
    container_name: abhedyax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abhedyax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abhedyax_secret}
      POSTGRES_DB: ${POSTGRES_DB:-abhedyax_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abhedyax} -d ${POSTGRES_DB:-abhedyax_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - abhedyax-net

  redis:
    image: redis:7-alpine
    container_name: abhedyax-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - abhedyax-net

networks:
  abhedyax-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
