# AbhedyaX — Docker Compose Demo Stack
# Usage: docker compose up --build
# For production deployment with real PCAP analysis:
#   ABHEDYAX_ANALYSIS_ENGINE=real docker compose up --build

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: abhedyax-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - SIMULATION_MODE=${SIMULATION_MODE:-true}
      - ABHEDYAX_ANALYSIS_ENGINE=${ABHEDYAX_ANALYSIS_ENGINE:-mock}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://web:3000"]
    volumes:
      - pcap_uploads:/workspace/storage/pcaps
      - reports_cache:/workspace/storage/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - abhedyax-net

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: abhedyax-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_SIMULATION_MODE=${NEXT_PUBLIC_SIMULATION_MODE:-true}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - abhedyax-net

networks:
  abhedyax-net:
    driver: bridge

volumes:
  pcap_uploads:
  reports_cache:
