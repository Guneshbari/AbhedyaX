[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abhedyax-ml"
version = "0.1.0"
description = "Encrypted Traffic Feature Extraction and ML Classification Pipeline for AbhedyaX"
authors = [{ name = "AbhedyaX Team" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "polars>=0.20.0",
    "pydantic>=2.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["../..", "."]
asyncio_mode = "auto"
