[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abhedyax-security-engine"
version = "0.1.0"
description = "Deterministic and auditable IPsec VPN security risk scoring engine"
authors = [{ name = "AbhedyaX Team" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["../../", "."]
