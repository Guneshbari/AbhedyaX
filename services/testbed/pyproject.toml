[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abhedyax-testbed"
version = "0.1.0"
description = "Controlled strongSwan IPsec Testbed and Ground-Truth Dataset Generator for AbhedyaX"
authors = [{ name = "AbhedyaX Team" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "scapy>=2.7.0",
    "click>=8.1.0",
]

[project.scripts]
testbed = "services.testbed.src.cli.main:cli"

[tool.pytest.ini_options]
pythonpath = ["../.."]
asyncio_mode = "auto"
